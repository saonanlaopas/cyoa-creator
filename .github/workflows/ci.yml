name: CI

on:
  push:
    branches:
      - main
      - checkpoint/**
      - codex/a6-conversational-editing
      - codex/a7-studio-handoff
      - codex/m1-connected-editing
      - codex/m2-original-game-foundations
      - codex/m3-complete-text-game
      - codex/v1-asset-library
      - codex/v2-illustrated-scenes
      - codex/w1-locations-time
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/download-tweego.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:e2e --reporter=github,line
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
